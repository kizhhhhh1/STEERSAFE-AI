<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteerSafe AI - Fleet Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Google Login Overlay -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-card glass-panel">
            <div class="brand">
                <div class="logo"></div>
                <h2>SteerSafe AI</h2>
            </div>
            <p>Sign in to monitor fleet driving telemetry in real-time.</p>
            <button id="google-signin-btn" class="google-btn">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.9h6.6c-.28 1.5-.1.8-2.54 2.87v2.38h4.1c2.4-2.2 3.8-5.5 3.8-9.08z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-4.1-3.18c-1.13.77-2.6 1.22-3.83 1.22-3.6 0-6.64-2.44-7.72-5.7H.17v2.46c2 3.97 6.1 6.6 10.83 6.6z"/>
                    <path fill="#FBBC05" d="M4.28 13.43a7.17 7.17 0 0 1 0-4.56V6.4H.17a11.94 11.94 0 0 0 0 11.2l4.11-3.17z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.6 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0 7.27 0 3.17 2.62 1.17 6.6l4.11 3.17c1.08-3.26 4.12-5.7 7.72-5.7z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
        </div>
    </div>

    <!-- Main Application UI (Hidden until login) -->
    <div class="app-container" id="app-container" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"></div>
                <h2>SteerSafe AI</h2>
            </div>
            <nav>
                <a href="#" class="active">Live Dashboard</a>
                <a href="#">Fleet Overview</a>
                <a href="#">Driver History</a>
                <a href="#">Settings</a>
            </nav>
            <button id="logout-btn" class="logout-btn">Log Out</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h1>Live Dashboard</h1>
                <div class="user-profile">
                    <img id="user-avatar" src="" alt="Admin Profile">
                    <span id="user-name">Admin</span>
                </div>
            </header>

            <div class="dashboard-grid">
                <!-- Selected Driver Overview -->
                <section class="driver-overview glass-panel">
                    <h3>Current Driver: <span class="highlight">Alex Jensen</span></h3>
                    <div class="risk-gauge-container">
                        <svg class="circular-chart" viewBox="0 0 36 36">
                            <path class="circle-bg"
                              d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <path class="circle"
                              stroke-dasharray="100, 100"
                              d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                        </svg>
                        <div class="risk-score-text">
                            <div class="score" id="main-risk-score">0</div>
                            <div class="label" id="main-risk-label">Analyzing</div>
                        </div>
                    </div>
                </section>

                <!-- Telemetry Metrics -->
                <section class="metrics-grid">
                    <div class="metric-card glass-panel">
                        <h4>Current Speed</h4>
                        <div class="value" id="val-speed">0 <span class="unit">km/h</span></div>
                    </div>
                    <div class="metric-card glass-panel">
                        <h4>Harsh Braking</h4>
                        <div class="value" id="val-brake">0 <span class="unit">events</span></div>
                    </div>
                    <div class="metric-card glass-panel">
                        <h4>Sudden Accel</h4>
                        <div class="value" id="val-accel">0 <span class="unit">events</span></div>
                    </div>
                    <div class="metric-card glass-panel">
                        <h4>Sharp Turns</h4>
                        <div class="value" id="val-turns">0 <span class="unit">events</span></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Firebase SDK Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
