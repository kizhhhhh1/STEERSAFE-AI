<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteerSafe AI - Fleet Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"></div>
                <h2>SteerSafe AI</h2>
            </div>
            <nav>
                <a href="#" class="active">Live Dashboard</a>
                <a href="#">Fleet Overview</a>
                <a href="#">Driver History</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h1>Live Dashboard</h1>
                <div class="user-profile">
                    <img src="https://i.pravatar.cc/150?img=11" alt="Admin Profile">
                    <span>Admin</span>
                </div>
            </header>

            <div class="dashboard-grid">
                <!-- Selected Driver Overview -->
                <section class="driver-overview glass-panel">
                    <h3>Current Driver: <span class="highlight">Alex Jensen</span></h3>
                    <div class="risk-gauge-container">
                        <svg class="circular-chart" viewBox="0 0 36 36">
                            <path class="circle-bg"
                              d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <path class="circle"
                              stroke-dasharray="100, 100"
                              d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                        </svg>
                        <div class="risk-score-text">
                            <div class="score" id="main-risk-score">0</div>
                            <div class="label" id="main-risk-label">Analyzing</div>
                        </div>
                    </div>
                </section>

                <!-- Telemetry Metrics -->
                <section class="metrics-grid">
                    <div class="metric-card glass-panel">
                        <h4>Current Speed</h4>
                        <div class="value" id="val-speed">0 <span class="unit">km/h</span></div>
                    </div>
                    <div class="metric-card glass-panel">
                        <h4>Harsh Braking</h4>
                        <div class="value" id="val-brake">0 <span class="unit">events</span></div>
                    </div>
                    <div class="metric-card glass-panel">
                        <h4>Sudden Accel</h4>
                        <div class="value" id="val-accel">0 <span class="unit">events</span></div>
                    </div>
                    <div class="metric-card glass-panel">
                        <h4>Sharp Turns</h4>
                        <div class="value" id="val-turns">0 <span class="unit">events</span></div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
